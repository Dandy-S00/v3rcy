services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nitevow-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
    ports:
      - "3000:3000"
    networks:
      - nitevow

  db:
    image: mysql:8.4
    container_name: nitevow-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nitevow}
      MYSQL_USER: ${MYSQL_USER:-nitevow_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - nitevow_mysql_data:/var/lib/mysql
    networks:
      - nitevow
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  nitevow_mysql_data:
    name: nitevow_mysql_data

networks:
  nitevow:
    name: nitevow
