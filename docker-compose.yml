services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_ID: ${VITE_APP_ID:?Set VITE_APP_ID in .env}
        VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL:?Set VITE_OAUTH_PORTAL_URL in .env}
        VITE_MAPS_API_URL: ${VITE_MAPS_API_URL:-}
        VITE_MAPS_API_KEY: ${VITE_MAPS_API_KEY:-}
    container_name: nitevow-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      VITE_APP_ID: ${VITE_APP_ID:?Set VITE_APP_ID in .env}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:?Set OAUTH_SERVER_URL in .env}
      SERVICE_API_URL: ${SERVICE_API_URL:-}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
    expose:
      - "3000"
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.v3rya.rule: Host(`${APP_DOMAIN:?Set APP_DOMAIN in .env}`)
      traefik.http.routers.v3rya.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.v3rya.tls: "true"
      traefik.http.routers.v3rya.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.v3rya.loadbalancer.server.port: "3000"
      traefik.http.routers.v3rya-http.rule: Host(`${APP_DOMAIN:?Set APP_DOMAIN in .env}`)
      traefik.http.routers.v3rya-http.entrypoints: ${TRAEFIK_HTTP_ENTRYPOINT:-web}
      traefik.http.routers.v3rya-http.middlewares: v3rya-https-redirect
      traefik.http.middlewares.v3rya-https-redirect.redirectscheme.scheme: https
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nitevow
      - traefik

  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_ID: ${VITE_APP_ID:-}
        VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL:-}
        VITE_MAPS_API_URL: ${VITE_MAPS_API_URL:-}
        VITE_MAPS_API_KEY: ${VITE_MAPS_API_KEY:-}
    command: ["pnpm", "db:push"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
    networks:
      - nitevow

  db:
    image: mysql:8.4
    container_name: nitevow-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nitevow}
      MYSQL_USER: ${MYSQL_USER:-nitevow_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - nitevow_mysql_data:/var/lib/mysql
    networks:
      - nitevow
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  nitevow_mysql_data:
    name: nitevow_mysql_data

networks:
  nitevow:
    name: nitevow
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
